# peq configuration file
#
# The PHP version peq's own sources are written for, so that analysing this
# project reads them the same way on every runtime peq supports.
#
# Patterns to exclude from analysis:
# - vendor: Composer dependencies
# - vendor-bin: Development tools
# - .git: Git metadata
# - tests: Test files (avoids analyzing test dependencies)

phpVersion: '8.3'

excludes:
  - vendor
  - vendor-bin
  - .git
  - tests
