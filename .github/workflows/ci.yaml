# The workflow name is what the README status badge renders as its label.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each supported minor resolves its own dependency graph, and PHPUnit's
          # schema differs per major, so every leg selects the lock file and the
          # configuration that belong to it.
          - php: '8.1'
            test-script: 'test:unit:10'
            phpunit-config: phpunit10.xml.dist
          - php: '8.2'
            test-script: 'test:unit:11'
            phpunit-config: phpunit11.xml.dist
          - php: '8.3'
            test-script: 'test:unit'
            phpunit-config: phpunit.xml.dist
          - php: '8.4'
            test-script: 'test:unit'
            phpunit-config: phpunit.xml.dist
          - php: '8.5'
            test-script: 'test:unit'
            phpunit-config: phpunit.xml.dist
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl
          ini-values: zend.assertions=1, memory_limit=2G
          coverage: none

      - name: Select the lock file of this PHP minor
        run: cp "composer.lock.php-${{ matrix.php }}" composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: 'true'

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Run the unit tests
        run: composer ${{ matrix.test-script }}

      - name: Run the contract tests
        run: vendor/bin/phpunit --configuration ${{ matrix.phpunit-config }} --testsuite contract

      - name: Run the integration tests
        run: vendor/bin/phpunit --configuration ${{ matrix.phpunit-config }} --testsuite integration

      - name: Run the documented examples
        run: vendor/bin/phpunit --configuration ${{ matrix.phpunit-config }} --testsuite doctest

  tests-parallel:
    name: Tests through the parallel runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl
          ini-values: zend.assertions=1, memory_limit=2G
          coverage: none

      - name: Select the lock file of this PHP minor
        run: cp composer.lock.php-8.5 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: 'true'

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Run the suite under the parallel runner
        run: composer test

  lint:
    name: Lint on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl
          ini-values: memory_limit=2G
          coverage: none

      - name: Select the lock file of this PHP minor
        run: cp "composer.lock.php-${{ matrix.php }}" composer.lock

      - name: Validate the Composer manifest against the lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: 'true'

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Check the formatting
        run: composer format:check

      - name: Analyse with PHPStan
        run: composer phpstan

      - name: Check compatibility with the PHP floor
        run: composer compat

      - name: Check the source metrics
        run: composer loc-guard

      - name: Check the directory structure
        run: composer tree-guard

      - name: Check the architecture layers
        run: composer deptrac

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scoring a pull request means diffing it against its base branch,
          # which needs more than the single commit a shallow clone provides.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl
          ini-values: zend.assertions=1, memory_limit=4G
          # Infection needs a coverage driver. pcov is several times faster than
          # Xdebug and Infection collects nothing Xdebug alone can provide.
          coverage: pcov

      - name: Select the lock file of this PHP minor
        run: cp composer.lock.php-8.5 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: 'true'

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      # The unit suite only, because that is the suite whose coverage metadata is
      # complete; infection.json5 explains why the gate is scored against it. The
      # run carries no --do-not-fail-on-risky: the suite is green with coverage on,
      # and keeping it that way is what makes the metadata worth trusting.
      - name: Generate coverage for mutation testing
        run: >-
          php -d memory_limit=2G vendor/bin/phpunit
          --no-extensions
          --testsuite unit
          --coverage-xml build/infection-coverage/coverage-xml
          --log-junit build/infection-coverage/junit.xml

      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --coverage=build/infection-coverage
          --skip-initial-tests
          --git-diff-lines
          --git-diff-base="origin/${GITHUB_BASE_REF}"
          --ignore-msi-with-no-mutations
          --min-msi=85
          --min-covered-msi=85
          --no-progress
          --logger-github

      - name: Mutation testing on the whole source tree
        if: github.event_name != 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --coverage=build/infection-coverage
          --skip-initial-tests
          --no-progress
          --logger-github

      - name: Keep the escaped mutants for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-reports
          path: build/infection
          if-no-files-found: ignore

  build:
    name: Build the distributed binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, tests-parallel, lint]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl
          ini-values: phar.readonly=0, memory_limit=2G
          coverage: none

      - name: Select the lock file of this PHP minor
        run: cp composer.lock.php-8.4 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: 'true'

      - name: Compile the PHAR
        run: composer compile

      - name: Keep the PHAR for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peq.phar
          path: dist/peq.phar
