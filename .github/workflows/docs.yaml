# Publishes the DocGen site of the default branch to GitHub Pages.
#
# One-time setup in the repository:
#   1. Create the empty documentation branch:
#        git switch --orphan gh-pages
#        git commit --allow-empty -m 'docs: create the documentation branch'
#        git push -u origin gh-pages
#        git switch main
#   2. Settings > Pages > Build and deployment > Source: "Deploy from a branch",
#      branch "gh-pages", folder "/ (root)".
#
# The site owns the root of that branch: everything else there is replaced on
# every run, except `pr/` (previews written by docs-preview.yaml) and `CNAME`
# (a custom Pages domain).
name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'
  DOCS_BRANCH: gh-pages

jobs:
  publish:
    name: Generate and publish the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          # gd is what the Open Graph image is drawn with; without it the pages
          # are published all the same, only without a social preview.
          extensions: mbstring, pcntl, gd
          # pcov, not none: the site links every method to the test cases
          # covering it, which needs a --coverage-xml report.
          coverage: pcov
          ini-values: zend.assertions=1, memory_limit=2G

      - name: Select the matching lock file
        run: cp composer.lock.php-8.4 composer.lock

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
          composer-options: --prefer-dist

      - name: Restore the DocGen cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/doc-gen-cache
          # composer.lock is generated from the per-version lock file this job
          # copies, so the tracked file is what the key is drawn from.
          key: doc-gen-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.4') }}-${{ github.sha }}
          restore-keys: |
            doc-gen-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.4') }}-
            doc-gen-${{ runner.os }}-

      # The report the `doc-gen` script points --coverage at. phpunit.xml.dist
      # keeps beStrictAboutCoverageMetadata on, so this step is also what keeps
      # the #[CoversClass] and #[UsesClass] metadata of the suite honest: a test
      # that executes a class it never declared fails the run.
      - name: Generate the coverage report the site reads
        run: |
          php -d memory_limit=2G vendor/bin/phpunit \
            --no-extensions --testsuite unit \
            --coverage-xml build/coverage-xml

      # doc-gen is configured by its options alone, and this project's options
      # live in the `doc-gen` Composer script. The address the site is published
      # at is what the workflow knows and the script cannot work out, so the job
      # passes it: every page then carries its canonical link and the tags a
      # shared link is rendered from.
      - name: Generate the documentation
        run: |
          set -euo pipefail

          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          composer doc-gen -- --memory-limit=1G \
            --base-url="https://${repository%%/*}.github.io/${repository#*/}"

      - name: Check out the documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DOCS_BRANCH }}
          path: .docs-branch

      - name: Publish the site
        working-directory: .docs-branch
        run: |
          set -euo pipefail

          # The site owns the root of the branch; the pull request previews
          # under pr/ and a custom Pages domain in CNAME are kept.
          rsync -a --checksum --delete --exclude '/.git/' --exclude '/pr/' --exclude '/CNAME' ../build/docs/ ./

          git add --all
          if git diff --cached --quiet; then
            echo "The ${DOCS_BRANCH} branch already serves this documentation."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "docs: generate from ${GITHUB_SHA}"
          git push origin "HEAD:${DOCS_BRANCH}"
