# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/tests?/.*#'
    - '#.*/vendor/.*#'

  layers:
    - name: Command
      collectors:
        - type: directory
          value: src/Command/.*

    - name: Action
      collectors:
        - type: directory
          value: src/Action/.*

    - name: Analyzer
      collectors:
        - type: directory
          value: src/Analyzer/[^/]*\.php$

    - name: Declaration
      collectors:
        - type: directory
          value: src/Analyzer/Declaration/.*

    - name: PhpStanAnalyzer
      collectors:
        - type: directory
          value: src/Analyzer/PhpStanAnalyzer/.*

    - name: NativeAnalyzer
      collectors:
        - type: directory
          value: src/Analyzer/NativeAnalyzer/.*

    - name: ExperimentAnalyzer
      collectors:
        - type: directory
          value: src/Analyzer/ExperimentAnalyzer/.*

    - name: ExperimentalReporter
      collectors:
        - type: directory
          value: src/Reporter/Experimental/.*

    - name: DebugAnalyzer
      collectors:
        - type: directory
          value: src/Analyzer/DebugAnalyzer/.*

    - name: Graph
      collectors:
        - type: directory
          value: src/Analyzer/Graph/.*

    - name: Reporter
      collectors:
        - type: directory
          value: src/Reporter/[^/]*\.php$

    - name: Traversal
      collectors:
        - type: directory
          value: src/Reporter/Traversal/.*

    - name: TreeReporter
      collectors:
        - type: directory
          value: src/Reporter/TreeReporter/.*

    - name: JsonReporter
      collectors:
        - type: directory
          value: src/Reporter/JsonReporter/.*

    - name: DotReporter
      collectors:
        - type: directory
          value: src/Reporter/DotReporter/.*

    - name: TableReporter
      collectors:
        - type: directory
          value: src/Reporter/TableReporter/.*

    - name: Gql
      collectors:
        - type: directory
          value: src/Gql/[^/]*\.php$

    - name: GqlLexing
      collectors:
        - type: directory
          value: src/Gql/Lexing/.*

    - name: GqlSyntax
      collectors:
        - type: directory
          value: src/Gql/Syntax/.*

    - name: GqlParsing
      collectors:
        - type: directory
          value: src/Gql/Parsing/.*

    - name: GqlArgument
      collectors:
        - type: directory
          value: src/Gql/Argument/.*

    - name: GqlDatum
      collectors:
        - type: directory
          value: src/Gql/Datum/.*

    - name: GqlBinding
      collectors:
        - type: directory
          value: src/Gql/Binding/.*

    - name: GqlElement
      collectors:
        - type: directory
          value: src/Gql/Element/.*

    - name: GqlEvaluation
      collectors:
        - type: directory
          value: src/Gql/Evaluation/.*

    - name: GqlInvocation
      collectors:
        - type: directory
          value: src/Gql/Invocation/.*

    - name: GqlMatching
      collectors:
        - type: directory
          value: src/Gql/Matching/.*

    - name: GqlExecution
      collectors:
        - type: directory
          value: src/Gql/Execution/.*

    - name: GqlResult
      collectors:
        - type: directory
          value: src/Gql/Result/.*

    - name: Diagram
      collectors:
        - type: directory
          value: src/Reporter/Diagram/.*

    - name: GraphReporter
      collectors:
        - type: directory
          value: src/Reporter/GraphReporter/.*

    - name: QueryReporter
      collectors:
        - type: directory
          value: src/Reporter/Query/.*

    - name: Config
      collectors:
        - type: directory
          value: src/Config/.*

  ruleset:
    Command:
      - Action
      - Config
      - Reporter
      - QueryReporter
      - ExperimentalReporter
      - Gql
      - GqlElement
      - GqlResult

    Action:
      - Gql
      - GqlElement
      - GqlExecution
      - GqlResult
      - Analyzer
      - PhpStanAnalyzer
      - NativeAnalyzer
      - ExperimentAnalyzer
      - DebugAnalyzer
      - Graph
      - Config

    Analyzer:
      - Declaration
      - Graph

    Declaration:
      - Graph

    PhpStanAnalyzer:
      - Analyzer
      - Declaration
      - Graph

    NativeAnalyzer:
      - Analyzer
      - Declaration
      - Graph

    ExperimentAnalyzer:
      - Analyzer
      - Declaration
      - Graph

    ExperimentalReporter:
      - ExperimentAnalyzer
      - Config
      - Diagram

    DebugAnalyzer:
      - Analyzer
      - Graph

    Graph: ~

    Reporter:
      - Graph
      - Config
      - Traversal
      - Diagram
      - GraphReporter
      - TreeReporter
      - JsonReporter
      - DotReporter
      - TableReporter

    Traversal:
      - Reporter
      - Graph

    TreeReporter:
      - Reporter
      - Traversal
      - Graph

    JsonReporter:
      - Reporter
      - Graph

    DotReporter:
      - Reporter
      - Graph

    TableReporter:
      - Reporter
      - Graph

    Gql: ~

    GqlLexing:
      - Gql

    GqlArgument:
      - Gql
      - GqlDatum

    GqlDatum:
      - Gql

    GqlSyntax:
      - Gql
      - GqlDatum

    GqlParsing:
      - Gql
      - GqlLexing
      - GqlSyntax
      - GqlDatum

    GqlBinding:
      - Gql
      - GqlDatum

    GqlResult:
      - Gql
      - GqlDatum
      - GqlBinding

    GqlInvocation:
      - Gql
      - GqlArgument
      - GqlDatum

    GqlEvaluation:
      - Gql
      - GqlArgument
      - GqlDatum
      - GqlSyntax
      - GqlBinding
      - GqlInvocation

    GqlElement:
      - Gql
      - Graph
      - GqlDatum
      - GqlBinding
      - GqlResult
      - GqlInvocation

    GqlMatching:
      - Gql
      - GqlDatum
      - GqlSyntax
      - GqlBinding
      - GqlElement
      - GqlEvaluation

    GqlExecution:
      - Gql
      - Graph
      - GqlDatum
      - GqlSyntax
      - GqlParsing
      - GqlBinding
      - GqlElement
      - GqlEvaluation
      - GqlMatching
      - GqlResult

    Diagram: ~

    GraphReporter:
      - Reporter
      - Traversal
      - Graph
      - Diagram

    QueryReporter:
      - Config
      - Diagram
      - Gql
      - GqlDatum
      - GqlElement
      - GqlResult

    Config:
      - Graph
